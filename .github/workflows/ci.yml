name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited: re-check when the PR title changes (it becomes the squash commit on main)
    types: [opened, synchronize, reopened, edited]

concurrency:
  # A title edit must not cancel an in-progress build of the same commit
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Lint PR title (becomes the squash commit on main)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose
      - name: Lint branch commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  build:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24
      - uses: gradle/actions/setup-gradle@v4
      - run: make check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
