# SHARD Docker Spark cluster (standalone). Based on labs/compar-spark-docker.
# Run from the repo root: docker compose -f docker/docker-compose.yml up -d --scale spark-worker=N
name: shard

x-spark-image: &spark-image spark:4.2.1-scala2.13-java21-ubuntu

services:
  spark-master:
    image: *spark-image
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"        # master UI
      - "7077:7077"        # master URL
      - "4040-4050:4040-4050"  # application UI (driver runs here in client mode)
    volumes:
      - ../data:/data:ro
      - ../build/libs:/jars:ro
      - ../output:/output
      - ../experiments/runs:/runs   # profiled runs (--runs-dir /runs); the driver writes them, so master only

  spark-worker:
    image: *spark-image
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 2 --memory 2G
    depends_on:
      - spark-master
    volumes:
      - ../data:/data:ro
      - ../output:/output
